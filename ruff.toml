# Ruff configuration. Lives here rather than in pyproject.toml because this
# repo is not an installable package, and pixi.toml is not read by ruff.

target-version = "py39"
line-length = 110

[lint]
# Defaults (E4/E7/E9, F) plus import sorting.
extend-select = ["I"]

[lint.isort]
# preprocess.py and geometry_features.py import sibling modules by bare name
# (they run as scripts from the repo root), so those names have to be declared
# first-party or they get sorted in with third-party packages.
known-first-party = [
    "datasets",
    "fovnet",
    "preprocessing",
    "visuals",
    "geometry_features",
    "ray_casting",
]
