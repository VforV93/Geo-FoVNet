name: fovnet
channels:
  - pytorch
  - nvidia
  - conda-forge
  - lambouj
dependencies:
  # Python
  - python=3.9

  # PyTorch with CUDA 12.4
  - pytorch::pytorch=2.4.0
  - pytorch::pytorch-cuda=12.4

  # Scientific computing
  - conda-forge::numpy=1.23.5
  - conda-forge::scipy
  - conda-forge::scikit-learn

  # Visualization
  - conda-forge::matplotlib

  # CAD geometry (preprocessing & visualization)
  - conda-forge::pythonocc-core=7.5.1
  - lambouj::occwl

  # Utilities
  - conda-forge::tqdm
  - conda-forge::pyembree
  - pip
  - pip:
      - --find-links https://data.dgl.ai/wheels/torch-2.4/cu121/repo.html
      - dgl==2.4.0+cu121
      - lightning==2.5.6
      - torchmetrics
      - tensorboard
      - wandb
      - trimesh

